name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: cd viikko2/nhl-reader && uv sync
      - name: Run tests
        run: cd viikko2/nhl-reader && uv run coverage run --branch -m pytest
      - name: Coverage report
        run: cd viikko2/nhl-reader && uv run coverage xml
      - name: Coverage report to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Run Pylint
        run: cd viikko2/nhl-reader && uv run pylint src
